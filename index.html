<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div id="outerContainer">
  <div id="sidebar" class="hidden">
    <div id="sidebarHeader">
      <button id="viewThumbs" class="tab active" title="Thumbnails">Thumbnails</button>
      <button id="viewOutline" class="tab" title="Document outline">Outline</button>
    </div>
    <div id="thumbsView"></div>
    <div id="outlineView" class="hidden"></div>
  </div>

  <div id="mainContainer">
    <div id="toolbar">
      <div class="group left">
        <button id="sidebarToggle" class="tb" title="Toggle sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <span class="sep"></span>
        <button id="prev" class="tb" title="Previous page"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
        <button id="next" class="tb" title="Next page"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
        <input type="number" id="pageNumber" value="1" min="1" autocomplete="off">
        <span id="numPages">of 0</span>
      </div>
      <div class="group center">
        <button id="zoomOut" class="tb" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <select id="scaleSelect">
          <option value="auto">Automatic Zoom</option>
          <option value="page-actual">Actual Size</option>
          <option value="page-fit">Page Fit</option>
          <option value="page-width">Page Width</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
          <option value="3">300%</option>
          <option value="4">400%</option>
        </select>
        <button id="zoomIn" class="tb" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
      <div class="group right">
        <button id="edHighlight" class="tb" title="Highlight"><svg viewBox="0 0 24 24"><path d="M15 4l5 5-9 9H6v-5z"/><path d="M4 21h16"/></svg></button>
        <button id="edText" class="tb" title="Text"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
        <button id="edInk" class="tb" title="Draw"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/></svg></button>
        <button id="edStamp" class="tb" title="Add image"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M3 18l6-6 5 5 3-3 4 4"/></svg></button>
        <span class="sep"></span>
        <button id="splitToggle" class="tb" title="Split view (open a second PDF side by side)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
        <button id="print" class="tb" title="Print"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg></button>
        <button id="download" class="tb" title="Save"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>
        <button id="moreToggle" class="tb" title="More tools"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></button>
        <input type="file" id="fileInput" accept="application/pdf" hidden>
        <div id="moreMenu" class="hidden">
          <button id="openFile">Open file…</button>
          <button id="findToggle">Find <kbd>Ctrl+F</kbd></button>
          <button id="presentation">Presentation mode</button>
          <hr>
          <button id="themeToggle">Light theme</button>
          <button id="invertPages">Invert page colors</button>
        </div>
      </div>
      <div id="editParams" class="hidden">
        <span id="edColors"></span>
        <label id="edSizeLabel">Size <input type="range" id="edSize" min="6" max="60" value="10"></label>
      </div>
      <div id="findbar" class="hidden">
        <input id="findInput" placeholder="Find in document…" autocomplete="off">
        <button id="findPrev" class="tb" title="Previous">◀</button>
        <button id="findNext" class="tb" title="Next">▶</button>
        <label><input type="checkbox" id="findHighlight"> Highlight all</label>
        <label><input type="checkbox" id="findCase"> Match case</label>
        <span id="findStatus"></span>
      </div>
    </div>

    <div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>
    <div id="emptyState"><div id="homeCard">
        <svg class="homeIcon" viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 17v-5m0 0-2 2m2-2 2 2"/></svg>
        <h2>Open a PDF</h2>
        <p>Drag a file here, or pick one from your computer.<br>Everything stays in your browser.</p>
        <button id="emptyOpen">Open file</button>
      </div>
      <div id="recentWrap" class="hidden"><div class="recentHead"><h3>Recent files</h3><button id="recentClear">Clear</button></div><div id="recentList"></div></div>
    </div>
    <div id="dropHint" class="hidden">Drop the PDF here</div>
  </div>
</div>

<div id="audioPlayer" class="hidden">
  <button id="apPlay" title="Play/Pause">⏸</button>
  <span id="apLabel">Audio</span>
  <input type="range" id="apSeek" min="0" max="1000" value="0">
  <span id="apTime">0:00 / 0:00</span>
  <button id="apClose" title="Close">✕</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
